#                APP_DIR: ${{ secrets.APP_DIR }}
#                DB: ${{ secrets.DB }}
#                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
#                DB_USERNAME: ${{ secrets.DB_USERNAME }}
#                HOST: ${{ secrets.HOST }}

      # add docker
      - name: Set AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}

      # login to ECR
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # create docker image
      - name: Create docker image
        run: docker build -t moim-server .

      # add tag to docker image
      - name: Add tag to docker image
        run: docker tag moim-server ${{ steps.login-ecr.outputs.registry }}/moim-server:latest

      # push docker image to ECR
      - name: Push docker image to ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/moim-server:latest


      # access EC2 with SSH
      - name: Deploy container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            docker stop moim-server || true
            docker rm moim-server || true
            docker pull $ECR_REGISTRY/moim-server:latest       
            docker run --add-host=host.docker.internal:host-gateway \
              -e HOST=host.docker.internal \
              -e DB=${{ secrets.DB }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
              -p 8080:8080 \
              --name moim-server \
              -d $ECR_REGISTRY/moim-server:latest


      

